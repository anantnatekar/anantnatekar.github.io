baseURL = "https://anantnatekar.github.io/"
title = "Anant Natekar"
languageCode = "en"
theme = "hugo-coder"
defaultContentLanguage = "en"

[params]
    author = "Anant Natekar"
    description = "Engineering leadership, platform strategy, and software design."
    info = "Software Engineer & Builder"
    
    # Force the theme into an automatic clean light/dark mode
    colorScheme = "auto"
    customCSS = ["css/custom.css"]
    
    # Hide the profile picture avatar to match the extreme text minimalism of vinny.dev
    hideAvatar = true

    # Custom text footer parameters
    footerLines = [
        "Hand-written from my terminal.",
        "Built with Hugo. Hosted on GitHub Pages."
    ]

# Setup the precise // explore structure of vinny.dev
[[menu.main]]
    name = "// writing"
    weight = 1
    url = "posts/"

[[menu.main]]
    name = "// apps"
    weight = 2
    url = "apps/"

[[menu.main]]
    name = "// about"
    weight = 3
    url = "about/"