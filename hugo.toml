baseURL = "https://anantnatekar.github.io/"
title = "Anant Natekar"
languageCode = "en"
theme = "hugo-coder"
defaultContentLanguage = "en"

[params]
    author = "Anant Natekar"
    info = "Technologist, builder, and leader"

    colorScheme = "auto"
    customCSS = ["css/custom.css"]
    hideAvatar = false
    avatarurl = "images/avatar.jpg"

    tagline = "I build technology, products, and teams — and I'm curious about what changes when AI enters the equation."

    footerTagline = "Thinking about technology, AI, leadership, and the things worth building."
    footerLines = [
        "Hand-written from my terminal.",
        "Built with Hugo. Hosted on GitHub Pages."
    ]

    [params.thesis]
        title = "The thesis"
        body = "Technology is rarely the hard part. The hard part is figuring out what to build, why it matters, and how to get an organization moving in the same direction. AI makes that challenge more interesting — not less."

    [params.evidence]
        title = "The evidence"
        items = [
            "Things I've built",
            "Conversations and talks about AI and technology"
        ]

    [params.books]
        title = "Krutika Natekar, author"
        blurb = "My daughter Krutika has been publishing books since she was 10 — proceeds go to the Wisconsin Humane Society."
        url = "https://www.amazon.com/stores/Krutika-Natekar/author/B08FBJ7FV8"
        cta = "See her books on Amazon"

