baseURL = "https://anantnatekar.github.io/"
title = "Anant Natekar"
languageCode = "en"
theme = "hugo-coder"
defaultContentLanguage = "en"

[params]
    author = "Anant Natekar"
    description = "Technology, AI, product, leadership, and things worth building."
    info = "Technologist, builder, and leader"

    colorScheme = "auto"
    customCSS = ["css/custom.css"]
    hideAvatar = false
    avatarurl = "images/avatar.jpg"

    tagline = "I build technology, products, and teams — and I'm curious about what changes when AI enters the equation."

    location = "Franklin, WI"

    footerTagline = "Thinking about technology, AI, leadership, and the things worth building."
    footerLines = [
        "Hand-written from my terminal.",
        "Built with Hugo. Hosted on GitHub Pages."
    ]

    [[params.stats]]
        value = "technology"
        label = "business + product"
    [[params.stats]]
        value = "AI"
        label = "enterprise + emerging tech"
    [[params.stats]]
        value = "build"
        label = "think, ship, learn"

    [[params.lanes]]
        title = "Technology & AI"
        description = "Exploring how technology and AI change products, platforms, organizations, and the way work gets done."
    [[params.lanes]]
        title = "Building & Leading"
        description = "I like turning ambiguous problems into clear decisions, strong teams, and things people can actually use."
    [[params.lanes]]
        title = "Still Tinkering"
        description = "I still build things myself — small apps, experiments, and prototypes that help me understand a problem from the inside."

    [params.thesis]
        title = "The thesis"
        body = "Technology is rarely the hard part. The hard part is figuring out what to build, why it matters, and how to get an organization moving in the same direction. AI makes that challenge more interesting — not less."

    [params.evidence]
        title = "The evidence"
        items = [
            "Things I've built",
            "Problems I've helped solve",
            "Teams and leaders I've helped grow",
            "Ideas I've written about",
            "Conversations and talks about AI and technology"
        ]

    [params.books]
        title = "Krutika Natekar, author"
        blurb = "My daughter Krutika has been publishing books since she was 10 — proceeds go to the Wisconsin Humane Society."
        url = "https://www.amazon.com/stores/Krutika-Natekar/author/B08FBJ7FV8"
        cta = "See her books on Amazon"

